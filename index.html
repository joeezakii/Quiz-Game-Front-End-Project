<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game - Home</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/quiz.css">
</head>
<body class="min-vh-100 d-flex flex-column justify-content-center align-items-center relative-container">
    
    <button id="theme-toggle" class="btn theme-toggle-btn shadow-sm" aria-label="Toggle Theme">
        <i id="theme-icon" class="bi bi-moon-stars-fill fs-5"></i>
    </button>

    <main class="container d-flex justify-content-center align-items-center my-4">
        <div class="card quiz-card shadow-lg border-0 p-4 p-sm-5 text-center" style="max-width: 500px; width: 100%;">
            
            <div class="d-flex justify-content-center align-items-center gap-2 mb-2">
                <i class="bi bi-lightbulb-fill text-warning fs-1"></i>
                <h1 class="card-title fw-bold mb-0 fs-3">
                    Welcome <span id="welcome-username" class="text-primary">Guest</span> to Quiz Game!
                </h1>
                <i class="bi bi-brain text-primary fs-1"></i>
            </div>
            
            <p class="text-secondary mb-4 fs-6">Enter your username and pick your avatar</p>
            
            <div class="mb-4">
                <input type="text" id="username-input" class="form-control form-control-lg text-center rounded-3 shadow-sm" placeholder="Enter Username" maxlength="20" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 px-2">
                <button id="prev-avatar" class="btn btn-outline-secondary rounded-circle p-2" type="button">
                    <i class="bi bi-chevron-left fs-5"></i>
                </button>
                
                <div class="avatar-container position-relative">
                    <img id="avatar-display" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Youssef" alt="Profile Avatar" class="rounded-circle border border-3 border-primary shadow" width="110" height="110">
                </div>

                <button id="next-avatar" class="btn btn-outline-secondary rounded-circle p-2" type="button">
                    <i class="bi bi-chevron-right fs-5"></i>
                </button>
            </div>

            <div class="d-grid gap-3">
                <button id="start-game-btn" class="btn btn-success btn-lg py-3 fw-bold shadow-sm d-flex justify-content-center align-items-center gap-2">
                    Start Game <i class="bi bi-play-circle-fill fs-5"></i>
                </button>

                <button id="view-leaderboard-btn" class="btn btn-outline-primary btn-lg py-3 fw-bold shadow-sm d-flex justify-content-center align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#leaderboardModal">
                    Leaderboard <i class="bi bi-trophy-fill fs-5 text-warning"></i>
                </button>
            </div>
        </div>
    </main>

    <div class="modal fade" id="leaderboardModal" tabindex="-1" aria-labelledby="leaderboardModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold fs-4 d-flex align-items-center gap-2" id="leaderboardModalLabel">
                        <i class="bi bi-trophy-fill text-warning fs-3"></i> Global Leaderboard
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Player</th>
                                    <th scope="col">Category</th>
                                    <th scope="col">Difficulty</th>
                                    <th scope="col">Score</th>
                                    <th scope="col">Accuracy</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboard-tbody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted py-4">Loading scores...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/home.js"></script>
</body>
</html>
